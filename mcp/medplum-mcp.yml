name: Medplum MCP Server
status: published
status_raw: hosted
transport: streamable-http
url: https://api.medplum.com/mcp/stream
auth: OAuth 2.0 (MCP authorization spec, 2025-06-18 revision)
operator: Medplum (Orangebot, Inc.)
description: Official hosted Medplum MCP server. Exposes the Medplum FHIR API to AI clients through a
  single general-purpose FHIR request tool plus two client-compatibility shims, authenticated with
  OAuth 2.0 against the user's own Medplum login, so the agent inherits that user's existing FHIR
  permissions rather than a separate service credential.
design_rationale: >-
  Medplum documents the small tool surface as a deliberate choice, not an unfinished one. Their
  argument: FHIR is a widely published open standard with abundant public specification, implementation
  guides and worked examples, so modern LLMs already know FHIR resource types, search syntax and
  reference traversal without vendor-specific instruction. Rather than hand-writing dozens of narrow
  tools (scheduling, labs, medications), they expose one low-level tool that maps directly onto the
  FHIR REST API and let the model bring its existing FHIR knowledge to bear. This is a standards-leverage
  bet — the value of publishing to a well-known standard is that the agent arrives already trained on it.
tools:
- name: fhir-request
  title: Perform a FHIR API Request
  role: primary
  description: >-
    Low-level tool that performs a direct FHIR API request against the server's FHIR R4 base URL.
    Full CRUD — create, read, update, delete. Medplum annotates the tool as data-modifying. This is
    the tool behind nearly every interaction.
  annotations:
    modifies_data: true
  methods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  parameters:
  - name: method
    type: string
    required: true
    enum: [GET, POST, PUT, PATCH, DELETE]
    description: The HTTP method for the request.
  - name: path
    type: string
    required: true
    description: >-
      The FHIR path, relative to the server's FHIR R4 base URL (e.g. 'Patient' or 'Patient?name=Smith').
      No leading slash and no '/fhir/R4' prefix.
  - name: body
    type: object
    required: false
    description: The JSON body of the FHIR resource to be created or updated.
- name: search
  role: compatibility
  description: >-
    Lightweight standard tool that some MCP clients (Medplum names ChatGPT) expect every server to
    implement in order to connect. Exists for client compatibility; Medplum states the real work is
    done through fhir-request, which performs searches directly against the FHIR API.
  parameters: not published in docs/ai/mcp; live schema requires an authenticated session
- name: fetch
  role: compatibility
  description: >-
    Second client-compatibility shim, documented jointly with `search` and for the same reason —
    connection requirements of clients that assume a search/fetch pair on every MCP server.
  parameters: not published in docs/ai/mcp; live schema requires an authenticated session
clients:
  documented:
  - name: Claude.ai
    path: Settings → Organization Integrations → Add Integration (name "Medplum", URL https://api.medplum.com/mcp/stream) → Connect → OAuth redirect to Medplum
    requires: paid Claude.ai plan
    verify: Medplum suggests confirming with "Can you please confirm you have access to the 'fhir-request' MCP tool?"
    caveat: Docs warn that LLM clients can cache sessions; disconnect and reconnect in a new chat if the integration misbehaves.
  - name: ChatGPT
    documented_as: named only as the motivating example for the `search`/`fetch` compatibility tools — no step-by-step setup published
  note: Claude.ai is the only client Medplum documents step-by-step, but the server speaks standard MCP,
    so other MCP clients should connect.
  directory: Docs state the published example use cases are intended to be visible in the Anthropic Directory listing.
examples_documented:
- prompt: Names of all patients with a systolic blood pressure observation over 140 in the last year
  path: GET Observation filtered by LOINC code and value, then follow references to Patient
- prompt: Create an appointment for a named patient with a named practitioner at a given time
  path: POST Appointment with a JSON body
- prompt: Most recent cholesterol lab results for a named patient
  path: GET Patient by name for the ID, then GET Observation filtered by patient and cholesterol code
