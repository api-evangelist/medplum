x-notes:
  write_capable: true
  significance: 'Notable for healthcare: this is an agent-facing WRITE path into a FHIR server. One tool
    (fhir-request) covers the entire FHIR surface rather than enumerating per-resource tools — a deliberately
    lean design that hands the agent the API instead of a curated tool list. Contrast with MEDITECH, whose
    developer program exposes no write surface at all.'
  governance_gaps: Medplum does not publish granular OAuth scopes for the MCP server — the docs say only
    that the user authorizes the client to access their data. With a single data-modifying tool spanning
    all of FHIR, authorization granularity rests entirely on the authenticated user's Medplum permissions.
    Worth flagging in any agent-readiness or governance review.
