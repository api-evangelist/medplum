x-notes:
  write_capable: true
  significance: 'Notable for healthcare: this is an agent-facing WRITE path into a FHIR server. One tool
    (fhir-request) covers the entire FHIR surface rather than enumerating per-resource tools — a deliberately
    lean design that hands the agent the API instead of a curated tool list. Contrast with MEDITECH, whose
    developer program exposes no write surface at all.'
  tool_count_is_three_but_surface_is_one: >-
    Medplum says "exactly three tools," and that is the honest count, but only fhir-request carries
    capability — `search` and `fetch` are connection shims for clients that require them. Any coverage
    math should treat the functional surface as one generalized tool; see mcp/medplum-tool-crosswalk.yml.
  governance_gaps: >-
    State this precisely, because the easy version of it is wrong. Medplum DOES have granular
    authorization: it supports SMART App Launch 2.0.0 scopes (patient/*.rs, user/*.cruds,
    patient/Observation.r and so on) with a scope-selection screen at authorization time, documented at
    https://www.medplum.com/docs/access/smart-scopes, layered on top of declarative Access Policies.
    The gap is not that the machinery is missing — it is that the MCP path is not documented as wired
    to it, in either direction. docs/ai/mcp never mentions scopes; the SMART scopes page never mentions
    MCP; and the RFC 9728 protected-resource metadata the MCP client actually discovers advertises only
    OIDC identity scopes (openid, profile, email, phone, address), with no SMART scope among them. So a
    connecting agent has nothing machine-discoverable telling it that a narrower grant is available or
    how to request one. Combined with a single data-modifying tool spanning all of FHIR, the practical
    default is that a connected agent's blast radius equals the authorizing user's — which for a
    clinician account is broad. Whether Medplum's authorize endpoint would honor a SMART scope on the
    MCP flow is UNVERIFIED here: confirming it needs an authenticated OAuth run, which this pass did
    not perform. Frame it in any agent-readiness or governance review as a discovery/documentation gap
    over working scope infrastructure, not as absent authorization.
  auth_discovery_observation: >-
    The 401 from the MCP endpoint returns `www-authenticate: Bearer realm="https://api.medplum.com/"`
    without the `resource_metadata` parameter that the MCP 2025-06-18 authorization spec expects for
    discovery. The protected-resource document is still reachable at the root well-known path, and its
    `resource` is the whole API ("https://api.medplum.com/"), not the MCP endpoint; the RFC 9728
    path-suffixed form /.well-known/oauth-protected-resource/mcp returns 404. Clients that rely strictly
    on the WWW-Authenticate hint to locate metadata get less than the spec describes. Recorded as
    observed behavior, not as a scored defect.
