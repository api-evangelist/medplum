generated: '2026-08-14'
method: searched
source: https://www.medplum.com/docs/compliance (+ sub-pages), openapi/medplum-fhir-api-openapi.yml, well-known/ probes
standards:
  - id: fhir-r4
    conforms: true
    evidence: >-
      OpenAPI paths are the generic FHIR R4 REST surface (/fhir/R4/{resourceType}...); 726
      component schemas in openapi/medplum-fhir-api-openapi.yml are FHIR R4 resource shapes; 9
      resource schemas separately captured under json-schema/.
  - id: smart-app-launch-2.0.0
    conforms: true
    evidence: >-
      "Medplum supports the SMART App Launch 2.0.0 standard" — https://www.medplum.com/docs/access/smart-scopes.
      Fine-grained (v2) scope syntax (patient/*.rs, user/*.cruds, launch, launch/patient,
      offline_access, online_access) confirmed on that page; see scopes/medplum-scopes.yml.
  - id: oauth2
    conforms: true
    evidence: >-
      RFC 8414 authorization-server metadata live at
      /.well-known/oauth-authorization-server (probed 200); authorizationCode + clientCredentials
      grant types advertised.
  - id: oidc
    conforms: true
    evidence: >-
      /.well-known/openid-configuration live (probed 200); scopes_supported includes openid,
      profile, email, phone, address; id_token_signing_alg_values_supported ES256/ES384/HS256/RS256.
  - id: rfc9728-protected-resource-metadata
    conforms: true
    evidence: /.well-known/oauth-protected-resource live (probed 200).
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      Errors are returned as FHIR OperationOutcome resources (resourceType, issue[].severity/code/
      details), not application/problem+json — confirmed by a live 401 response from the MCP
      endpoint. See errors/medplum-problem-types.yml.
  - id: fhir-operationoutcome-errors
    conforms: true
    evidence: >-
      Live-observed: POST to the MCP endpoint without auth returned
      {"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"login",...}]}].
      Documented at https://www.medplum.com/docs/api/fhir/resources/operationoutcome.
  - id: fhir-batch-transaction-bundles
    conforms: true
    evidence: >-
      Bundle.type batch/transaction documented at
      https://www.medplum.com/docs/fhir-datastore/fhir-batch-requests, including transaction
      atomicity, a 50-entry limit, and an 8-entry serializable-mode limit for bundles containing
      conditional operations.
  - id: fhir-conditional-create
    conforms: true
    evidence: >-
      ifNoneExist conditional-create parameter documented on the same FHIR Batch Requests page —
      the FHIR-native idempotency mechanism. See conventions/medplum-conventions.yml.
  - id: cds-hooks
    conforms: true
    evidence: "\"CDS Hooks\" listed under Standards in the docs left-nav (docs/standards section)."
  - id: c-cda
    conforms: true
    evidence: "\"C-CDA\" listed under Standards in the docs left-nav."
  - id: fhircast
    conforms: true
    evidence: FHIRcast documented as a supported real-time clinical-context sync protocol
      (apis.yml Integrations + docs left-nav "FHIRcast").
  - id: hl7v2
    conforms: true
    evidence: >-
      On-Prem Agent bridges HL7v2 ADT/ORU/SIU messages to FHIR — documented at docs left-nav
      "HL7 Interface" and confirmed in apis.yml Integrations/UseCases.
  - id: bulk-data-2.0
    conforms: true
    evidence: >-
      CLI docs (docs/cli) document `medplum bulk export`/`medplum bulk import`, explicitly citing
      the HL7 Bulk Data Access IG (build.fhir.org/ig/HL7/bulk-data/export.html).
  - id: json-api
    conforms: false
    evidence: FHIR+JSON resource representation, not the JSON:API media-type convention.
  - id: odata
    conforms: false
    evidence: No OData query syntax found; FHIR search parameters are used instead.
  - id: scim-2.0
    conforms: false
    evidence: No SCIM-shaped user-provisioning endpoints found in the OpenAPI or docs; user
      management is Medplum-proprietary (ProjectMembership, ClientApplication).
  - id: psd2
    conforms: false
    evidence: Not applicable — healthcare platform, no payments-initiation surface.
