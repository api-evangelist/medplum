    upgrade_tooling: 'medplum upgrade / medplum aws upgrade chains sequential minors (e.g. 5.0 -> 5.3) with transactional rollback'
  patch_release_schedule:
    cadence: approximately weekly
    breaking_changes: possible in Alpha-tagged features only
  security_patch_sla:
