deprecation:
  policy_url: https://www.medplum.com/docs/compliance/alpha-beta
  sunset_header: false
  sunset_header_note: No RFC 8594 Sunset/Deprecation HTTP headers documented; deprecation is
    communicated via a 3-stage stability model instead.
  stability_stages:
    - stage: Alpha
      breaking_changes: may occur in any release without advance notice; not covered by the
        deprecation policy
      marker: ':::info[Alpha] admonition in docs; @experimental TSDoc tag'
    - stage: Beta
      breaking_changes: possible, noted in release notes with a migration path where practical
      marker: ':::info[Beta] admonition in docs, or a (Beta) label'
    - stage: GA (Stable)
      breaking_changes: concentrated into major releases, announced in advance; full semver
        guarantees apply
      marker: '@deprecated TSDoc tag = scheduled for removal in next major'
  graduation_path: 'Alpha -> Beta -> GA, or retirement without reaching GA (announced in GitHub
    release notes and the #announcements Discord channel)'
  feedback_channel: https://github.com/medplum/medplum/issues
