dependency_support:
  nodejs: Supports current Active + Maintenance Node.js LTS releases (even-numbered LTS schedule, e.g. 22.x, 24.x)
  postgresql: Supports all PostgreSQL LTS versions overlapping a Medplum Active release (typically ~4 major versions)
  other: >-
    Dependencies without their own release schedule (Redis, React, Mantine) keep the major version
    supported at the start of a Medplum major version for that major's full lifecycle.
