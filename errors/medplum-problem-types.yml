format: fhir-operationoutcome
source: https://www.medplum.com/docs/api/fhir/resources/operationoutcome
note: >-
  openapi/medplum-fhir-api-openapi.yml declares NO 4xx/5xx responses on any of its 8 operations
  (derive-from-OpenAPI yielded nothing), so this catalog is built from the docs' OperationOutcome
  reference plus a live-observed error response, not from spec content. Medplum returns errors as
  FHIR OperationOutcome resources, NOT RFC 9457 application/problem+json — a genuine divergence
  from the RFC 9457 convention this pipeline otherwise favors, called out rather than mislabeled.
envelope:
  resourceType: OperationOutcome
  shape: 'issue[] each with severity (fatal|error|warning|information), code, details.text'
  schema_doc: https://www.medplum.com/docs/api/fhir/resources/operationoutcome
