problems:
  - status: 400
    title: Bad Request
    detail: Malformed FHIR resource, invalid search parameter, or a transaction exceeding the
      50-entry / 8-entry-with-conditionals bundle limits (docs/fhir-datastore/fhir-batch-requests).
    source_operation: openapi/medplum-fhir-api-openapi.yml#createResource
  - status: 401
    title: Unauthorized
    detail: Missing or invalid bearer token / expired session. Live-observed on the MCP endpoint
      (see x-evidence above); applies identically to the FHIR REST API per BearerAuth.
    source_operation: openapi/medplum-fhir-api-openapi.yml#search
  - status: 403
    title: Forbidden
    detail: Authenticated but the caller's Access Policy does not grant access to the requested
      resource type/field (docs/access/access-policies).
    source_operation: openapi/medplum-fhir-api-openapi.yml#readResource
  - status: 404
    title: Not Found
    detail: Resource id does not exist, or the resourceType is not a recognized FHIR R4 type.
    source_operation: openapi/medplum-fhir-api-openapi.yml#readResource
  - status: 405
    title: Method Not Allowed
    detail: HTTP verb not supported for the given FHIR interaction/resource combination.
    source_operation: openapi/medplum-fhir-api-openapi.yml#search
  - status: 409
    title: Conflict
    detail: Version conflict on updateResource (If-Match precondition failure) or a conditional
      create matching more than one existing resource.
    source_operation: openapi/medplum-fhir-api-openapi.yml#updateResource
  - status: 410
    title: Gone
    detail: Resource has been deleted; FHIR history is retained (readResourceHistory still
      resolves prior versions).
    source_operation: openapi/medplum-fhir-api-openapi.yml#deleteResource
  - status: 412
    title: Precondition Failed
    detail: ETag / If-Match version check failed on updateResource.
    source_operation: openapi/medplum-fhir-api-openapi.yml#updateResource
  - status: 422
    title: Unprocessable Entity
    detail: Resource fails FHIR structural or profile validation ($validate-style checks).
    source_operation: openapi/medplum-fhir-api-openapi.yml#createResource
  - status: 429
    title: Too Many Requests
    detail: Rate limit exceeded — see rate-limits/medplum-rate-limits.yml (per-IP request-count
      and per-user/project weighted FHIR interaction load).
    source_operation: openapi/medplum-fhir-api-openapi.yml#search
