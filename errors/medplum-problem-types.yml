    request: 'POST https://api.medplum.com/mcp/stream {"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    http_status: 401
    body: |
      {"resourceType":"OperationOutcome","id":"unauthorized","issue":[{"severity":"error","code":"login","details":{"text":"Unauthorized"}}],"extension":[{"url":"https://medplum.com/fhir/StructureDefinition/tracing","extension":[{"url":"requestId","valueId":"..."},{"url":"traceId","valueId":"..."}]}]}
